# Docs: https://render.com/docs/blueprint-spec
databases:
  - name: todo-db
    plan: free
    databaseName: tododb
    user: todouser

services:
  # ─── Backend (Node.js / Express) ───────────────────────────────
  - type: web
    name: be-todo
    env: docker
    dockerfilePath: ./Ugyen_Kinley_Phuntshok_02240337_DSO101_A1/backend/Dockerfile
    dockerContext: ./Ugyen_Kinley_Phuntshok_02240337_DSO101_A1/backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        fromDatabase:
          name: todo-db
          property: host
      - key: DB_USER
        fromDatabase:
          name: todo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: todo-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: todo-db
          property: database
      - key: DB_PORT
        fromDatabase:
          name: todo-db
          property: port
      - key: DB_SSL
        value: "true"
      - key: FRONTEND_URL
        value: https://fe-todo.onrender.com

  # ─── Frontend (React + nginx) ──────────────────────────────────
  - type: web
    name: fe-todo
    env: docker
    dockerfilePath: ./Ugyen_Kinley_Phuntshok_02240337_DSO101_A1/frontend/Dockerfile
    dockerContext: ./Ugyen_Kinley_Phuntshok_02240337_DSO101_A1/frontend
    plan: free
    envVars:
      - key: REACT_APP_API_URL
        value: https://be-todo.onrender.com